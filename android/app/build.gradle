import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def flutterRoot = "../.."

def readVersionFromPubspec() {
    def pubspecFile = rootProject.file("../pubspec.yaml")
    if (!pubspecFile.exists()) {
        throw new GradleException("pubspec.yaml not found at ${pubspecFile}")
    }

    def matcher = (pubspecFile.text =~ /(?m)^version:\s*([^\s+]+)(?:\+(\d+))?\s*$/)
    if (!matcher.find()) {
        throw new GradleException("Could not parse version from ${pubspecFile}")
    }

    return [
        name: matcher.group(1),
        code: (matcher.group(2) ?: "1").toInteger(),
    ]
}

def appVersion = readVersionFromPubspec()


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.blazesmoker.fanotifier"

    compileSdk = 36
    //ndkVersion = "25.1.8937393"
    ndkVersion = "27.3.13750724"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId = "com.blazesmoker.fanotifier"

        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = appVersion.code
        versionName = appVersion.name

    }




    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

flutter {
    source = flutterRoot
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation "com.google.errorprone:error_prone_annotations:2.18.0"
    implementation "javax.annotation:javax.annotation-api:1.3.2"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    implementation 'com.google.android.material:material:1.12.0'
    implementation "androidx.work:work-runtime-ktx:2.10.0"
}
