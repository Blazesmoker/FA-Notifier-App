import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def flutterRoot = "../.."

def readVersionFromPubspec() {
    def pubspecFile = rootProject.file("../pubspec.yaml")
    if (!pubspecFile.exists()) {
        throw new GradleException("pubspec.yaml not found at ${pubspecFile}")
    }

    def matcher = (pubspecFile.text =~ /(?m)^version:\s*([^\s+]+)(?:\+(\d+))?\s*$/)
    if (!matcher.find()) {
        throw new GradleException("Could not parse version from ${pubspecFile}")
    }

    return [
        name: matcher.group(1),
        code: (matcher.group(2) ?: "1").toInteger(),
    ]
}

def appVersion = readVersionFromPubspec()


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.blazesmoker.fanotifier"

    compileSdk = 37
    //ndkVersion = "25.1.8937393"
    ndkVersion = "29.0.14206865"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        applicationId = "com.blazesmoker.fanotifier"

        minSdk = 26
        targetSdk = 37
        versionCode = appVersion.code
        versionName = appVersion.name

    }




    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = flutterRoot
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation "com.google.errorprone:error_prone_annotations:2.49.0"
    implementation "javax.annotation:javax.annotation-api:1.3.2"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    implementation 'com.google.android.material:material:1.14.0'
    implementation "androidx.work:work-runtime-ktx:2.11.2"
}
