name: FANotifier

description: Unofficial FA App.

publish_to: "none"

version: 1.3.1+27

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.9.0
  firebase_analytics: ^12.1.3

  flutter_inappwebview: ^6.2.0-beta.3

  cupertino_icons: ^1.0.9

  webview_flutter: ^4.13.0

  visibility_detector: ^0.4.0+2

  http: ^1.3.0
  html: ^0.15.0

  #cached_network_image: ^3.4.1

  cached_network_image:
    git:
      url: https://github.com/LOCKEDFILE/flutter_cached_network_image.git
      ref: 0b3e640
      path: cached_network_image





  flutter_cache_manager: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0

  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.0
  provider: ^6.1.5+1
  like_button: ^2.0.2
  carousel_slider: ^5.0.0
  permission_handler: ^12.0.1
  path_provider: ^2.0.0
  fluttertoast: ^9.0.0
  dio_cookie_manager: ^3.4.0
  dio: ^5.1.2
  cookie_jar: ^4.0.9
  collection: ^1.17.0
  image_picker: ^1.2.1
  app_links: ^7.0.0

  package_info_plus: ^10.1.0
  crypto: ^3.0.7


  badges: ^3.2.0
  flutter_linkify: ^6.0.0
  extended_text: ^15.0.2

  flutter_switch: ^0.3.2



  workmanager: ^0.9.0+3
  app_badge_plus: ^1.3.1
  auto_size_text: ^3.0.0
  flutter_local_notifications: ^21.0.0

  flutter_blurhash: ^0.9.1



  device_info_plus: ^13.1.0
  saver_gallery: ^4.1.1
  share_plus: ^13.1.0
  file_picker: ^12.0.0-beta.4



  flutter_html: ^3.0.0-beta.2
  google_mlkit_language_id: ^0.13.1
  flutter_bbcode: ^1.5.0
  timezone: ^0.11.0
  font_awesome_flutter: ^11.0.0
  flutter_rating_bar: ^4.0.1
  intl: ^0.20.2
  animations: ^2.0.3
  vector_math: ^2.2.0


  webview_flutter_wkwebview: ^3.23.5
  google_mlkit_commons: ^0.11.1


dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

#dependency_overrides:  ###possible fix for nested inappwebview text selection.
  #webview_flutter:
    #git:
      #url: https://github.com/Blazesmoker/plugins.git
      #path: packages/webview_flutter/webview_flutter
      #ref: main

flutter_icons:
  android: false
  ios: true
  image_path: "assets/icons/AppIcon.png"


flutter_native_splash:
  color: "#000000"
  image: assets/icons/fathemed.png #assets/icons/fathemed.png
  android: true
  ios: false
  fullscreen: true
  android_gravity: center






flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/images/defaultpic.gif
    - assets/emojis/
    - assets/webview/fa/
    - packages/timezone/data/latest_all.tzf
  fonts:

    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 400
